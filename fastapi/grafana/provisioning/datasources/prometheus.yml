# Автоматическое подключение Prometheus к Grafana при старте контейнера
# (docker compose маунтит этот каталог в /etc/grafana/provisioning).
# uid совпадает с датасорсом в fastapi/grafana.json.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
