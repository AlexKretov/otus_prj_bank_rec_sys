# Скрейпинг метрик микросервиса (GET /metrics на ml_service).
# Если сервис поднят вне compose на нестандартном порту, поправьте targets.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Правила алертов — fastapi/prometheus/alerts.yml (монтируется из compose).
# Alertmanager не настроен: сработки видны в UI Prometheus (Status → Alerts).
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'bank-recommender'
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - ml-service:8079
