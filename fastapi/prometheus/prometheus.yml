# Скрейпинг метрик микросервиса (GET /metrics на ml_service).
# Если сервис поднят вне compose на нестандартном порту, поправьте targets.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'bank-recommender'
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - ml-service:8079
