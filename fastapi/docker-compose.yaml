# Инфраструктура микросервиса: API + Prometheus + Grafana.
# Запуск из корня репозитория:
#   docker compose -f fastapi/docker-compose.yaml up --build
# Все порты/учётки — через переменные окружения со значениями по умолчанию
# (см. .env.example): VM_PORT, THE_PORT, PROMETHEUS_PORT, GRAFANA_PORT,
# GRAFANA_USER, GRAFANA_PASS, LOG_LEVEL.
services:
  ml_service:
    build:
      context: ..
      dockerfile: fastapi/Dockerfile
    environment:
      THE_PORT: ${THE_PORT:-8079}
      ARTIFACTS_DIR: fastapi
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${VM_PORT:-8079}:${THE_PORT:-8079}"
    networks:
      default:
        aliases:
          # prometheus.yml скрейпит ml-service:8079 — alias гарантирует,
          # что имя разрешается (hostname: сам по себе DNS-псевдонимом не является)
          - ml-service
    hostname: ml-service

  prometheus:
    image: prom/prometheus:v2.53.2
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    depends_on:
      - ml_service
    hostname: prometheus

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
    volumes:
      # Дашборд и provisioning: datasource (Prometheus) + автозагрузка дашбордов.
      # Без этих маунтов Grafana поднимается пустой — дашборд приходится
      # импортировать руками через UI.
      - "./grafana.json:/var/lib/grafana/dashboards/bank-recommender.json:ro"
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
    depends_on:
      - prometheus
    hostname: grafana
