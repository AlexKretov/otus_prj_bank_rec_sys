# Инфраструктура микросервиса: API + Prometheus + Grafana.
# Запуск из корня репозитория:
#   docker compose -f fastapi/docker-compose.yaml up --build
# Порты, учётка Grafana и параметры сервиса — через переменные окружения
# со значениями по умолчанию (см. .env.example): VM_PORT, THE_PORT,
# PROMETHEUS_PORT, GRAFANA_PORT, GRAFANA_USER, GRAFANA_PASS, LOG_LEVEL,
# THREAD_POOL_TOKENS, DRIFT_WINDOW_SIZE, DRIFT_MIN_SAMPLES.
services:
  ml_service:
    build:
      context: ..
      dockerfile: fastapi/Dockerfile
    environment:
      THE_PORT: ${THE_PORT:-8079}
      ARTIFACTS_DIR: ${ARTIFACTS_DIR:-fastapi}
      MODEL_PATH: ${MODEL_PATH:-fastapi/saved_model.pkl}
      PARAMS_PATH: ${PARAMS_PATH:-fastapi/preprocessing_params.json}
      REPLACER_PATH: ${REPLACER_PATH:-fastapi/replacer.json}
      PERSONAL_RECS_PATH: ${PERSONAL_RECS_PATH:-fastapi/personal_als.parquet}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      THREAD_POOL_TOKENS: ${THREAD_POOL_TOKENS:-10}
      DRIFT_WINDOW_SIZE: ${DRIFT_WINDOW_SIZE:-2000}
      DRIFT_MIN_SAMPLES: ${DRIFT_MIN_SAMPLES:-200}
    ports:
      - "${VM_PORT:-8079}:${THE_PORT:-8079}"
    networks:
      default:
        aliases:
          # prometheus.yml по умолчанию скрейпит ml-service:8079 — alias гарантирует,
          # что имя разрешается. Если меняете THE_PORT, поменяйте target в prometheus.yml.
          - ml-service
    hostname: ml-service

  prometheus:
    image: prom/prometheus:v2.53.2
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      # правила алертов (BankRecommenderDown/HighLatency/HighErrorRate/FeatureDrift)
      - "./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"
    depends_on:
      - ml_service
    hostname: prometheus

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
    volumes:
      # Дашборд и provisioning: datasource (Prometheus) + автозагрузка дашбордов.
      # Без этих маунтов Grafana поднимается пустой — дашборд приходится
      # импортировать руками через UI.
      - "./grafana.json:/var/lib/grafana/dashboards/bank-recommender.json:ro"
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
    depends_on:
      - prometheus
    hostname: grafana
