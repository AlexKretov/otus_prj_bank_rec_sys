[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-q'

[tool.ruff]
line-length = 100
target-version = 'py311'

[tool.ruff.lint]
# F — pyflakes (неиспользуемые импорты, неопределённые имена),
# E — pycodestyle-ошибки. Ноутбуки ruff по умолчанию не трогает.
select = ['F', 'E']

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['E402']
